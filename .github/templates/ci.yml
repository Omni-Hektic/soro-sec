name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Compile
      run: cargo build --verbose

    - name: Run Tests
      run: cargo test --verbose

    - name: Self-Scan Tests
      run: cargo run -- tests/fixtures/vulnerable_contract.rs || true
